name: Conversion preparation contracts
on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]
jobs:
  plan-export:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 compatibility needs an image with published interpreter builds.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Validate preparation and retained recovery file checks without device access
        shell: pwsh
        run: |
          $contracts = @('test_conversion_plan.py', 'test_recovery_evidence.py', 'test_gpt_audit.py', 'test_capture_adapter.py', 'test_capture_process.py', 'test_capture_bundle.py', 'test_capture_audit.py', 'test_firewall_preview.py', 'test_endpoint_preview.py', 'test_conversion_review.py', 'test_storage_evidence.py', 'test_conversion_review_storage.py')
          foreach ($contract in $contracts) {
            python -B -m unittest discover -s tests -p $contract
            if ($LASTEXITCODE -ne 0) { throw "Compatibility contract failed: $contract" }
          }
      - name: Stress bounded Python process cleanup without hardware
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -I -B tests/check_capture_process_stress.py --output "$env:RUNNER_TEMP/capture-process-stress" --source-revision '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic process stress failed.' }
      - name: Retain synthetic process stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CaptureProcessStress-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/capture-process-stress
          if-no-files-found: warn
