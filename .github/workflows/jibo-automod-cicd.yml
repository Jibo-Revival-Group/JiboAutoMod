name: Jibo AutoMod CI/CD

on:
  push:
    branches:
      - main
      - master
      - Dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.x'
        include:
          - python-version: '3.x'
            package: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libusb-1.0-0-dev gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install libusb pkgconf arm-none-eabi-gcc e2fsprogs

      - name: Setup MSYS2 build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libusb

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Build Shofel native tools
        if: runner.os != 'Windows'
        run: make -C Exploits/Shofel all readonly

      - name: Build Shofel native tools on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          pkg-config --cflags --libs libusb-1.0
          make -C Exploits/Shofel shofel2_t124 shofel2_t124_readonly
          echo "OPENJIBO_READONLY_CC=$(cygpath -w "$(command -v gcc)")" >> "$GITHUB_ENV"

      - name: Verify native read-only policy without USB
        shell: pwsh
        run: |
          $compiler = if ($IsWindows) { $env:OPENJIBO_READONLY_CC } else { (Get-Command cc -ErrorAction Stop).Source }
          if ($IsWindows) { $env:PATH = (Split-Path -Parent $compiler) + ';' + $env:PATH }
          $hostName = if ($IsWindows) { 'shofel2_t124_readonly.exe' } else { 'shofel2_t124_readonly' }
          python -I -B tests/check_readonly_native.py --compiler $compiler --output "$env:RUNNER_TEMP/readonly-native-contract" --real-host "Exploits/Shofel/$hostName" --source-revision '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Read-only native contract failed.' }
          python -I -B tests/check_capture_adapter_native.py --fixture "$env:RUNNER_TEMP/readonly-native-contract"
          if ($LASTEXITCODE -ne 0) { throw 'Bounded capture adapter native integration failed.' }

      - name: Export Windows static runtime components without executing them
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Split-Path -Parent $env:OPENJIBO_READONLY_CC
          $licenses = Join-Path (Split-Path -Parent $runtime) 'share/licenses'
          python -I -B capture_bundle.py export-windows --host Exploits/Shofel/shofel2_t124_readonly.exe --runtime $runtime --licenses $licenses --source "$env:RUNNER_TEMP/readonly-native-contract/reviewed-source" --source-revision '${{ github.sha }}' --output "$env:RUNNER_TEMP/windows-static-components"
          if ($LASTEXITCODE -ne 0) { throw 'Windows static dependency export failed.' }

      - name: Upload Windows static runtime component review
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CaptureComponents-Windows-${{ github.sha }}
          path: ${{ runner.temp }}/windows-static-components
          if-no-files-found: error

      - name: Upload read-only compiler and fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: ReadOnlyNative-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/readonly-native-contract
          if-no-files-found: error

      - name: Stage release files
        if: matrix.package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish -Force | Out-Null
          Copy-Item JiboModTool.py,conversion_plan.py,recovery_evidence.py,gpt_audit.py,gpt_layout.py,capture_adapter.py,capture_process.py,capture_bundle.py,pe_imports.py,capture_audit.py,firewall_preview.py,endpoint_preview.py,config.py,firewall_patch.py,ext4_path.py,diagnose_firewall_cache.py,requirements.txt,README.md -Destination publish
          Copy-Item Docs,Exploits,profiles -Destination publish -Recurse

      - name: Verify staged offline entry points and dependencies
        if: matrix.package
        run: python -I -B tests/check_staged_offline.py --root publish

      - name: Verify staged firewall sector preview without hardware
        if: matrix.package
        shell: pwsh
        run: |
          python -I -B tests/check_firewall_preview.py --tool-root publish --output "$env:RUNNER_TEMP/firewall-preview-contract" --source-revision '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Staged firewall preview failed.' }

      - name: Upload synthetic staged firewall preview evidence
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: FirewallPreview-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/firewall-preview-contract
          if-no-files-found: error

      - name: Verify staged endpoint file preview without network or hardware
        if: matrix.package
        shell: pwsh
        run: |
          python -I -B tests/check_endpoint_preview.py --tool-root publish --output "$env:RUNNER_TEMP/endpoint-preview-contract" --source-revision '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Staged endpoint preview failed.' }

      - name: Upload synthetic staged endpoint preview evidence
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: EndpointPreview-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/endpoint-preview-contract
          if-no-files-found: error

      - name: Package artifact
        if: matrix.package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath JiboAutoMod-${{ runner.os }}-${{ github.sha }}.zip -Force

      - name: Upload artifact for download
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: JiboAutoMod-${{ runner.os }}-${{ github.sha }}
          path: JiboAutoMod-${{ runner.os }}-${{ github.sha }}.zip
          if-no-files-found: error

      - name: Publish release download
        if: matrix.package && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: JiboAutoMod-${{ runner.os }}-${{ github.sha }}.zip
